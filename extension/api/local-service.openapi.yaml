components:
  schemas:
    AndNode:
      properties:
        op:
          type: string
          const: and
          title: Op
        items:
          items:
            $ref: '#/components/schemas/Node'
          type: array
          maxItems: 50
          title: Items
      type: object
      required:
      - op
      - items
      title: AndNode
    ChannelCheckRequest:
      properties:
        url:
          type: string
          maxLength: 2000
          minLength: 1
          title: Url
        cookies:
          items:
            $ref: '#/components/schemas/Cookie'
          type: array
          title: Cookies
          default: []
        filters:
          $ref: '#/components/schemas/FiltersModel'
          default:
            from_end: false
            music_only: false
      type: object
      required:
      - url
      title: ChannelCheckRequest
    ChannelCheckResponse:
      properties:
        title:
          type: string
          title: Title
        videos:
          type: integer
          title: Videos
        downloaded:
          type: integer
          title: Downloaded
        matching:
          type: integer
          title: Matching
          description: 'How many will be downloaded with the filters: they pass and are not downloaded
            yet (downloader.md, section 6.0)'
        models:
          items:
            type: string
          type: array
          title: Models
        found_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Found By
        folder:
          anyOf:
          - type: string
          - type: 'null'
          title: Folder
        recent:
          items:
            type: string
          type: array
          title: Recent
      type: object
      required:
      - title
      - videos
      - downloaded
      - matching
      - models
      - found_by
      - folder
      - recent
      title: ChannelCheckResponse
    ChannelRequest:
      properties:
        url:
          type: string
          maxLength: 2000
          minLength: 1
          title: Url
        cookies:
          items:
            $ref: '#/components/schemas/Cookie'
          type: array
          title: Cookies
          default: []
        folder:
          type: string
          minLength: 3
          title: Folder
          description: Full path of the folder
        filters:
          $ref: '#/components/schemas/FiltersModel'
          default:
            from_end: false
            music_only: false
        preset_edits:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Preset Edits
        keep_original:
          type: boolean
          title: Keep Original
          description: downloader.md, section 2.2
          default: false
        start:
          type: boolean
          title: Start
          description: False — the queue is paused (user), recompress.md section 6.3
          default: true
      type: object
      required:
      - url
      - folder
      title: ChannelRequest
    CheckNowRequest:
      properties:
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
          description: One subscription; none — all
      type: object
      title: CheckNowRequest
    Connection:
      properties:
        profile_id:
          type: string
          title: Profile Id
        name:
          type: string
          title: Name
        connected_at:
          type: string
          title: Connected At
          description: ISO 8601 with the time zone
      type: object
      required:
      - profile_id
      - name
      - connected_at
      title: Connection
    ConnectionRequest:
      properties:
        profile_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Profile Id
          description: Random id the extension made on its first start
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          description: Name of the profile
      type: object
      required:
      - profile_id
      - name
      title: ConnectionRequest
    Cookie:
      properties:
        domain:
          type: string
          title: Domain
        name:
          type: string
          title: Name
        value:
          type: string
          title: Value
        path:
          type: string
          title: Path
          default: /
        secure:
          type: boolean
          title: Secure
          default: false
        expirationDate:
          anyOf:
          - type: number
          - type: 'null'
          title: Expirationdate
      type: object
      required:
      - domain
      - name
      - value
      title: Cookie
      description: A cookie as chrome.cookies gives it; other fields are ignored.
    CookiesRequest:
      properties:
        sites:
          additionalProperties:
            items:
              $ref: '#/components/schemas/Cookie'
            type: array
          type: object
          title: Sites
          description: Address of a video → cookies of its site
      type: object
      required:
      - sites
      title: CookiesRequest
    DownloadModel:
      properties:
        id:
          type: integer
          title: Id
        url:
          type: string
          title: Url
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        channel:
          anyOf:
          - type: string
          - type: 'null'
          title: Channel
        published_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Published At
        state:
          type: string
          title: State
        error:
          anyOf:
          - $ref: '#/components/schemas/MessageModel'
          - type: 'null'
          description: Code and text (docs/codes.md, section 2)
        progress:
          anyOf:
          - type: number
          - type: 'null'
          title: Progress
        eta_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Eta Seconds
          description: Seconds left to download, from yt-dlp
        folder:
          type: string
          title: Folder
        file_path:
          anyOf:
          - type: string
          - type: 'null'
          title: File Path
        original_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Original Path
          description: 'The original kept for now: «waits for the original to be deleted», downloader.md
            section 2.2'
        compress_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Compress Seconds
          description: Recompression time estimate, recompress.md section 2.12.1
        compress_bytes:
          anyOf:
          - type: number
          - type: 'null'
          title: Compress Bytes
          description: How much the compressed video will take, an estimate
        compress_approximate:
          type: boolean
          title: Compress Approximate
          default: false
      type: object
      required:
      - id
      - url
      - title
      - channel
      - published_at
      - state
      - error
      - progress
      - folder
      - file_path
      title: DownloadModel
    DuplicateRequest:
      properties:
        keep:
          type: string
          enum:
          - old
          - new
          - both
          title: Keep
          description: old — the new video to the trash; new — the old one; both — not duplicates
      type: object
      required:
      - keep
      title: DuplicateRequest
    EnqueueRequest:
      properties:
        url:
          type: string
          maxLength: 2000
          minLength: 1
          title: Url
        cookies:
          items:
            $ref: '#/components/schemas/Cookie'
          type: array
          title: Cookies
          default: []
        folder:
          type: string
          minLength: 3
          title: Folder
          description: Full path of the folder
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        preset_edits:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Preset Edits
        music_only:
          type: boolean
          title: Music Only
          description: downloader.md, section 8
          default: false
        keep_original:
          type: boolean
          title: Keep Original
          description: downloader.md, section 2.2
          default: false
        start:
          type: boolean
          title: Start
          description: False — the queue is paused (user), recompress.md section 6.3
          default: true
      type: object
      required:
      - url
      - folder
      title: EnqueueRequest
    FileCheckModel:
      properties:
        path:
          type: string
          title: Path
        action:
          type: string
          title: Action
          description: recompress, sound (only the sound) or skip
