openapi: 3.1.0
info:
  title: Tidy Reel local service
  version: 0.1.0
paths:
  /api/connection:
    get:
      tags:
      - connection
      summary: Get Connection
      operationId: get_connection
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          description: Wrong key
        '403':
          description: Not the connected extension
      security:
      - HTTPBearer: []
    post:
      tags:
      - connection
      summary: Create Connection
      operationId: create_connection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewConnection'
        '403':
          description: Not a page of an extension
        '409':
          description: Another profile is connected
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - connection
      summary: Delete Connection
      operationId: delete_connection
      responses:
        '204':
          description: Successful Response
        '401':
          description: Wrong key
        '403':
          description: Not the connected extension
      security:
      - HTTPBearer: []
  /api/presets:
    get:
      tags:
      - presets
      summary: List Presets
      operationId: list_presets
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PresetResponse'
                type: array
                title: Response List Presets
        '401':
          description: Wrong key
        '403':
          description: Not the connected extension
      security:
      - HTTPBearer: []
    post:
      tags:
      - presets
      summary: Create Preset
      operationId: create_preset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetResponse'
        '401':
          description: Wrong key
        '403':
          description: Not the connected extension
        '404':
          description: No such preset
        '409':
          description: Name or site taken, or the default preset
        '422':
          description: Wrong field value
      security:
      - HTTPBearer: []
  /api/presets/sites:
    get:
      tags:
      - presets
      summary: List Preset Sites
      operationId: list_preset_sites
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response List Preset Sites
        '401':
          description: Wrong key
        '403':
          description: Not the connected extension
      security:
      - HTTPBearer: []
  /api/presets/{preset_id}:
    put:
      tags:
      - presets
      summary: Replace Preset
      operationId: replace_preset
      security:
      - HTTPBearer: []
      parameters:
      - name: preset_id
        in: path
        required: true
        schema:
          type: integer
          title: Preset Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetResponse'
        '401':
          description: Wrong key
        '403':
          description: Not the connected extension
        '404':
          description: No such preset
        '409':
          description: Name or site taken, or the default preset
        '422':
          description: Wrong field value
    delete:
