components:
  schemas:
    AndNode:
      properties:
        op:
          type: string
          const: and
          title: Op
        items:
          items:
            $ref: '#/components/schemas/Node'
          type: array
          maxItems: 50
          title: Items
      type: object
      required:
      - op
      - items
      title: AndNode
    ChannelCheckResponse:
      properties:
        title:
          type: string
          title: Title
        videos:
          type: integer
          title: Videos
        downloaded:
          type: integer
          title: Downloaded
        models:
          items:
            type: string
          type: array
          title: Models
        found_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Found By
        folder:
          anyOf:
          - type: string
          - type: 'null'
          title: Folder
        recent:
          items:
            type: string
          type: array
          title: Recent
      type: object
      required:
      - title
      - videos
      - downloaded
      - models
      - found_by
      - folder
      - recent
      title: ChannelCheckResponse
    ChannelRequest:
      properties:
        url:
          type: string
          maxLength: 2000
          minLength: 1
          title: Url
        cookies:
          items:
            $ref: '#/components/schemas/Cookie'
          type: array
          title: Cookies
          default: []
        folder:
          type: string
          minLength: 3
          title: Folder
          description: Full path of the folder
        filters:
          $ref: '#/components/schemas/FiltersModel'
          default:
            from_end: false
            music_only: false
        preset_edits:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Preset Edits
      type: object
      required:
      - url
      - folder
      title: ChannelRequest
    CheckNowRequest:
      properties:
        id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Id
          description: One subscription; none — all
      type: object
      title: CheckNowRequest
    CheckRequest:
      properties:
        url:
          type: string
          maxLength: 2000
          minLength: 1
          title: Url
        cookies:
          items:
            $ref: '#/components/schemas/Cookie'
          type: array
          title: Cookies
          default: []
      type: object
      required:
      - url
      title: CheckRequest
    CheckResponse:
      properties:
        video:
          $ref: '#/components/schemas/VideoInfoModel'
        downloaded:
          anyOf:
          - type: string
          - type: 'null'
          title: Downloaded
          description: 'Already downloaded: where the file is now'
        models:
          items:
            type: string
          type: array
          title: Models
        found_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Found By
          description: links, account or name
        folder:
