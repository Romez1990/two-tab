openapi: 3.1.0
info:
  title: video-analyzer local service
  version: 0.1.0
paths:
  /api/connection:
    get:
      tags:
      - connection
      summary: Get Connection
      operationId: get_connection
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          description: Wrong key
        '403':
          description: Not the connected extension
      security:
      - HTTPBearer: []
    post:
      tags:
      - connection
      summary: Create Connection
      operationId: create_connection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewConnection'
        '403':
          description: Not a page of an extension
        '409':
          description: Another profile is connected
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - connection
      summary: Delete Connection
      operationId: delete_connection
      responses:
        '204':
          description: Successful Response
        '401':
          description: Wrong key
        '403':
          description: Not the connected extension
      security:
      - HTTPBearer: []
