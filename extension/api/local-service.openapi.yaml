  /api/downloads/items/next:
    get:
      tags:
      - downloads
      summary: Next Downloads Item
      description: 'A click on a counter: the next video after `after` (without it — the first) with an
        open

        message of the kind (decision, unread, errors) among the filters, round the queue.'
      operationId: next_downloads_item
      security:
      - HTTPBearer: []
      parameters:
      - name: kind
        in: query
        required: true
        schema:
          type: string
          title: Kind
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: After
      - name: filter
        in: query
        required: false
        schema:
          type: string
          default: active
          title: Filter
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/NextItemModel'
                - type: 'null'
                title: Response Next Downloads Item
        '401':
          description: Wrong key
        '403':
          description: Not the connected extension
        '422':
          description: Unknown filter
